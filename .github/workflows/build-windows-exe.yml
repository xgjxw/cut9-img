name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 表情包工坊.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify source
        shell: powershell
        run: |
          python -m py_compile meme_cli\cli.py meme_cli\gui.py
          python -m py_compile skills\xhs-life-philosophy-illustration\scripts\create_xhs_project.py

      - name: Build EXE
        shell: cmd
        run: build_gui_exe.bat

      - name: Prepare release assets
        shell: powershell
        run: |
          Copy-Item -LiteralPath .\dist\meme-workshop.exe -Destination .\dist\meme-workshop-windows.exe -Force
          Get-ChildItem -LiteralPath .\dist
          Get-FileHash -LiteralPath .\dist\meme-workshop-windows.exe -Algorithm SHA256
          Get-FileHash -LiteralPath .\dist\表情包工坊.exe -Algorithm SHA256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: meme-workshop-windows-exe
          path: |
            dist/meme-workshop-windows.exe
            dist/表情包工坊.exe
          if-no-files-found: error

      - name: Publish build release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: build-${{ github.run_number }}
          name: 表情包工坊 Windows EXE build ${{ github.run_number }}
          body: |
            自动构建的 Windows 可执行文件。

            Commit: ${{ github.sha }}
            Workflow run: ${{ github.run_number }}
          artifacts: |
            dist/meme-workshop-windows.exe
            dist/表情包工坊.exe
          allowUpdates: false
          makeLatest: true
