name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build meme-workshop exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify source
        shell: powershell
        run: |
          python -m py_compile meme_cli\cli.py meme_cli\gui.py
          python -m py_compile skills\xhs-life-philosophy-illustration\scripts\create_xhs_project.py

      - name: Build EXE
        shell: cmd
        run: build_gui_exe.bat

      - name: Prepare release assets
        shell: powershell
        run: |
          Copy-Item -LiteralPath .\dist\meme-workshop.exe -Destination .\dist\meme-workshop-windows.exe -Force
          Get-ChildItem -LiteralPath .\dist
          Get-FileHash -LiteralPath .\dist\meme-workshop-windows.exe -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meme-workshop-windows-exe
          path: dist/meme-workshop-windows.exe
          if-no-files-found: error

      - name: Publish latest GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: windows-latest
          RELEASE_NAME: Meme Workshop Windows Latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $env:TAG_NAME $env:GITHUB_SHA
          git push -f origin $env:TAG_NAME

          @"
          Automatic Windows executable build.
          - File: meme-workshop-windows.exe
          - Commit: $env:GITHUB_SHA
          - Workflow run: $env:GITHUB_RUN_NUMBER
          "@ | Set-Content -LiteralPath release-notes.md -Encoding UTF8

          $ErrorActionPreference = "Continue"
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_NAME" --silent 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if (-not $releaseExists) {
            gh release create $env:TAG_NAME .\dist\meme-workshop-windows.exe --title $env:RELEASE_NAME --notes-file release-notes.md --latest
          } else {
            gh release upload $env:TAG_NAME .\dist\meme-workshop-windows.exe --clobber
            gh release edit $env:TAG_NAME --title $env:RELEASE_NAME --notes-file release-notes.md --latest
          }
