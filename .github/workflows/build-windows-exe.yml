name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 九宫格切图器.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify source
        shell: powershell
        run: |
          python -m py_compile meme_cli\cli.py meme_cli\gui.py

      - name: Build EXE
        shell: cmd
        run: build_gui_exe.bat

      - name: Rename EXE
        shell: powershell
        run: |
          python -c "from pathlib import Path; import shutil; target = Path('dist') / '\u4e5d\u5bab\u683c\u5207\u56fe\u5668.exe'; shutil.copyfile(Path('dist') / 'meme-gui.exe', target)"
          Remove-Item -LiteralPath .\dist\meme-gui.exe -Force
          Get-ChildItem -LiteralPath .\dist
          Get-FileHash -LiteralPath (Get-ChildItem .\dist\*.exe | Select-Object -First 1).FullName -Algorithm SHA256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: cut9-img-windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish latest release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -LiteralPath .\dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "EXE not found"
          }

          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest $exe.FullName --title "Latest Windows EXE" --notes "Auto-built latest Windows executable."
