[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-cli"
version = "0.1.0"
description = "Batch convert images into WeChat-friendly meme assets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "tkinterdnd2>=0.4.3", "pycryptodome>=3.20"]

[project.scripts]
meme-cli = "meme_cli.cli:main"

[project.gui-scripts]
meme-gui = "meme_cli.gui:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
